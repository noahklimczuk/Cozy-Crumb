name: iOS

# Runs on every push to every branch, not just on pull requests, so a branch
# gets a build result *before* a PR is opened for it.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30

    # Write access, for one thing only: republishing the screen captures onto
    # the `ci/screens` branch. See that step for why an artifact alone is not
    # enough. Nothing else in this workflow writes to the repository.
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -project "Cozy Crumb.xcodeproj" -list || true

      # Still built with -target rather than -scheme: the Info.plist check
      # below reads the product out of build/, which is where a -target build
      # puts it, and a -scheme build would hide it in DerivedData. The Test
      # step does use the shared scheme, which now names a test target.
      # Signing is disabled because a simulator build does not need it and the
      # project carries a personal DEVELOPMENT_TEAM that CI cannot use.
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project "Cozy Crumb.xcodeproj" \
            -target "Cozy Crumb" \
            -configuration Debug \
            -sdk iphonesimulator \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build.log

      # The app's Info.plist is a merge of two things: Config/CozyCrumb-Info.plist
      # carries the URL scheme (there is no INFOPLIST_KEY_ for CFBundleURLTypes)
      # and GENERATE_INFOPLIST_FILE layers the INFOPLIST_KEY_* settings on top.
      # If that merge ever stops happening the app still builds perfectly — it
      # just quietly loses its usage strings and the share hand-off — so the
      # keys are checked in the product rather than assumed.
      - name: Check the built Info.plists
        run: |
          set -e
          APP="build/Debug-iphonesimulator/Cozy Crumb.app"

          echo "Scheme, from the partial plist:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$APP/Info.plist"
          echo "Display name and usage string, from the INFOPLIST_KEY_* settings:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSRemindersFullAccessUsageDescription" "$APP/Info.plist"
          # A missing camera string is not a build error — it is a crash the
          # first time someone taps the pantry's camera button.
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP/Info.plist"

          echo "The extension, and its principal class with \$(PRODUCT_MODULE_NAME) expanded:"
          APPEX="$APP/PlugIns/Cozy CrumbShare.appex/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APPEX"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPrincipalClass" "$APPEX"

      # The app compiling and its unit tests passing says nothing about whether
      # it survives being opened, which is the one thing every user does first.
      # A redesign shipped green through this workflow and then crashed on
      # launch, so the app is now actually started here: installed on a
      # simulator, launched with its output attached, and left running long
      # enough to get past the splash and build the first real screen.
      #
      # Nothing here stays attached to the app. The first cut of this step
      # backgrounded `simctl launch --console-pty` and killed the shell's job
      # afterwards, which does not reliably reap the process simctl spawns — the
      # runner then waits on it and the step hangs until the job times out, which
      # is a worse failure than the one it was written to catch. So the app is
      # launched detached and inspected afterwards, and the step carries its own
      # timeout as a backstop.
      #
      # Failure is judged on a crash report appearing for this bundle rather
      # than on the launch command's exit code — `simctl launch` reports success
      # the moment the process is spawned, and a SwiftUI crash happens a beat
      # later while the first view builds.
      - name: Launch smoke test
        timeout-minutes: 16
        run: |
          set -o pipefail
          APP="build/Debug-iphonesimulator/Cozy Crumb.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "Bundle: $BUNDLE_ID"

          # Checked up front rather than discovered per-capture: without it the
          # render check silently verifies nothing, and a smoke test that
          # verifies nothing is indistinguishable from a passing one.
          [ -f .github/scripts/blank-screen.py ] || {
            echo "::error::.github/scripts/blank-screen.py is missing — the render check cannot run."
            exit 1
          }

          # The reported device first, then anything.
          #
          # This used to take whichever iPhone came first in the list, which is
          # a smaller phone than the one the launch failure was reported on —
          # an iPhone 16 Pro Max, 440x956pt. A smoke test that passes on
          # different geometry to the one that fails is not testing the thing,
          # and this has spent an evening being green while the app would not
          # open. Matching the model does not make a simulator into a phone,
          # but it removes one difference for free.
          # Every `grep` here is `|| true`, and it is load-bearing rather than
          # decoration. The step runs under `bash -e` with `pipefail`, so a
          # grep that matches nothing makes the whole substitution non-zero and
          # kills the step on the spot — which is exactly what the first cut of
          # this did: it printed "Bundle:" and died, on a runner that simply
          # had no iPhone 16 Pro Max installed. Not finding a model is a normal
          # outcome to be handled, not a failure.
          AVAILABLE=$(xcrun simctl list devices available || true)

          DEVICE=""
          for NAME in "iPhone 16 Pro Max" "iPhone 16 Pro" "iPhone 16"; do
            DEVICE=$(printf '%s\n' "$AVAILABLE" \
              | grep -F "$NAME (" \
              | head -1 \
              | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)
            if [ -n "$DEVICE" ]; then
              echo "Simulator: $NAME"
              break
            fi
          done

          if [ -z "$DEVICE" ]; then
            DEVICE=$(printf '%s\n' "$AVAILABLE" \
              | grep -E '^ +iPhone' \
              | head -1 \
              | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)
            echo "Simulator: first available iPhone (no preferred model on this runner)"
          fi
          [ -n "$DEVICE" ] || { echo "::error::No iPhone simulator available."; exit 1; }

          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b

          # Clear old reports so anything found afterwards belongs to this run.
          REPORTS=~/Library/Logs/DiagnosticReports
          mkdir -p "$REPORTS"; rm -f "$REPORTS"/*.ips 2>/dev/null || true

          xcrun simctl install "$DEVICE" "$APP"

          # Both appearances, because a simulator boots light and half this
          # app's colour system is the dark half. A palette bug that only
          # resolves after dark is invisible to a light-mode-only smoke test,
          # which is exactly the gap that let one through.
          launch_in () {
            MODE="$1"
            echo "----- launching in $MODE mode -----"
            xcrun simctl ui "$DEVICE" appearance "$MODE" || true
            xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
            rm -f "$REPORTS"/*.ips 2>/dev/null || true

            # Keep the PID. `simctl launch` prints "<bundle id>: <pid>", and a
            # simulator app is a real process on the host, so the host's own
            # `ps` can answer "is it still up" without going back through
            # simctl. That matters — see `alive` below.
            LAUNCH_OUT=$(xcrun simctl launch "$DEVICE" "$BUNDLE_ID")
            echo "$LAUNCH_OUT"
            PID=$(printf '%s' "$LAUNCH_OUT" | sed -nE 's/.*: *([0-9]+).*/\1/p')
            echo "[$MODE] pid: ${PID:-unknown}"

            # Two shots, because the app spends its first four seconds showing
            # a splash that holds the real UI at opacity 0. A black splash and a
            # black app are the same complaint from the outside and completely
            # different bugs, and only one of them is visible at 25 seconds.
            capture () {
              LABEL="$1"
              SHOT="/tmp/shot-$LABEL.png"
              xcrun simctl io "$DEVICE" screenshot "$SHOT" >/dev/null 2>&1 || true
              [ -f "$SHOT" ] || { echo "::error::[$LABEL] no screenshot — the render check cannot run."; return 1; }

              sips -Z 48 -s format bmp "$SHOT" --out "/tmp/small-$LABEL.bmp" >/dev/null 2>&1 || true
              VERDICT=$(python3 .github/scripts/blank-screen.py "/tmp/small-$LABEL.bmp" 2>&1 || echo "unknown")
              echo "[$LABEL] blank screen: $VERDICT"

              sips -Z 220 "$SHOT" --out "/tmp/view-$LABEL.png" >/dev/null 2>&1 || true
              echo "----- BEGIN SCREENSHOT $LABEL -----"
              base64 -i "/tmp/view-$LABEL.png" | fold -w 200 || true
              echo "----- END SCREENSHOT $LABEL -----"

              # Only an explicit "no" passes. A check that could not reach a
              # verdict — no screenshot, sips failed, the script missing — is a
              # check that did not run, and the one thing it must never do is
              # read as "fine". The upgrade probe learned this the expensive
              # way: it shipped on a branch whose base predated
              # blank-screen.py, every capture returned a bare "unknown", the
              # old `*) return 0` swallowed all six of them, and the run went
              # green having verified nothing but that the process was alive.
              case "$VERDICT" in
                no*)  return 0 ;;
                yes*) return 1 ;;
                *)    echo "::error::[$LABEL] the render check produced no verdict."; return 1 ;;
              esac
            }

            # Mid-splash.
            sleep 2
            SPLASH_OK=1
            capture "$MODE-splash" || SPLASH_OK=""

            # Past the splash and into the first real screen, which is where a
            # SwiftUI launch failure actually shows up.
            sleep 25

            # Asked two ways, and retried, because a single `simctl spawn
            # launchctl list` is not trustworthy: it spawns a process inside
            # the simulator and can come back empty or non-zero while the app
            # is perfectly alive. That is not hypothetical — this step failed a
            # run with "still running: no" and a screenshot, taken one second
            # later, of the app's own Library screen. A flaky check that fails
            # a green app is worse than no check at all, so the host's `ps` on
            # the launch PID is asked first and the simctl probe is only the
            # fallback.
            alive () {
              if [ -n "$PID" ] && ps -p "$PID" >/dev/null 2>&1; then
                return 0
              fi
              xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null \
                | grep -q "$BUNDLE_ID"
            }

            ALIVE=no
            for _ in 1 2 3; do
              if alive; then ALIVE=yes; break; fi
              sleep 2
            done

            CRASHES=$(grep -lF "Cozy Crumb" "$REPORTS"/*.ips 2>/dev/null || true)
            echo "[$MODE] still running: $ALIVE"

            # Printed on every run, not only on failure. These are the
            # LaunchTrace breadcrumbs, and their whole value is comparative:
            # a launch that stalls on someone's phone is only readable against
            # a launch that didn't, and this is the only place a known-good
            # one gets recorded. A missing "first frame on screen" here would
            # also mean the app never drew, which no other check states
            # outright.
            TRACE_PREDICATE="subsystem == \"$BUNDLE_ID\""
            echo "----- [$MODE] launch trace -----"
            xcrun simctl spawn "$DEVICE" log show --last 3m \
              --predicate "$TRACE_PREDICATE" \
              --style compact 2>/dev/null | grep -F "launch:" || echo "(no launch trace in the log)"

            MAIN_OK=1
            capture "$MODE-main" || MAIN_OK=""

            if [ -n "$MAIN_OK" ] && [ -n "$SPLASH_OK" ]; then BLANK_FAIL=""; else BLANK_FAIL=1; fi

            if [ -n "$CRASHES" ] || [ "$ALIVE" = no ] || [ -n "$BLANK_FAIL" ]; then
              echo "===== [$MODE] what the app logged ====="
              xcrun simctl spawn "$DEVICE" log show --last 3m \
                --predicate 'processImagePath CONTAINS "Cozy Crumb"' \
                --style compact 2>/dev/null | tail -80 || true

              for c in $CRASHES; do
                echo "===== [$MODE] crash report: $c ====="
                head -140 "$c"
              done
              return 1
            fi
            return 0
          }

          FAILED=""
          launch_in light || FAILED="$FAILED light"
          launch_in dark  || FAILED="$FAILED dark"

          if [ -n "$FAILED" ]; then
            echo "::error::The app did not survive launch in:$FAILED"
            exit 1
          fi

          echo "The app launched and stayed up in both appearances."

          # ----- Every screen, both appearances, as a downloadable artifact --
          #
          # Nobody working on this repository from a Linux checkout can see the
          # app. Layout bugs were being diagnosed by reading code and guessing
          # at pixel positions, which is how the tab bar came to eat the bottom
          # of every scroll view. This turns that into a photograph.
          #
          # The app is relaunched per screen rather than driven through the UI:
          # simctl cannot tap, and a UI test target is a lot of machinery for
          # what a launch argument does in one line. `-cozyStartTab` opens on a
          # tab, `-cozySampleData` fills an empty store so the Cookbook has
          # cards in it, and `-cozySkipSplash` gets the cupcake out of the way.
          #
          # Never `exit 1`. This is a camera, not a test: a screenshot that
          # fails to capture must not turn a green build red, or the real
          # checks above start getting ignored.
          echo "----- capturing screens -----"
          mkdir -p "$RUNNER_TEMP/screens"

          # One tab, once, into a named file. Everything below is a loop
          # around this.
          capture () {
            LABEL="$1"; TAB="$2"
            xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$DEVICE" "$BUNDLE_ID" \
              -cozyStartTab "$TAB" \
              -cozySampleData YES \
              -cozySkipSplash YES >/dev/null 2>&1 || true

            # Long enough for the launch passes to finish and the grid to
            # settle. The passes sleep a frame between each of seven, and a
            # hero photo decodes off the main thread after that.
            sleep 4

            SHOT="$RUNNER_TEMP/screens/$LABEL-$TAB.png"
            xcrun simctl io "$DEVICE" screenshot "$SHOT" >/dev/null 2>&1 \
              && echo "captured $LABEL/$TAB" \
              || echo "could not capture $LABEL/$TAB"
          }

          for MODE in light dark; do
            xcrun simctl ui "$DEVICE" appearance "$MODE" || true
            for TAB in library groceries sousChef pantry settings; do
              capture "$MODE" "$TAB"
            done
          done

          # A third pass at the largest accessibility text size.
          #
          # Every layout in this app has been judged at the default size, so
          # "does this break at AX5" has been a guess every time it came up —
          # and the answers have not been good: a 4pt bullet in front of type
          # that grows to 53pt, a fixed-height row, a title that wraps
          # mid-word. `simctl ui content_size` sets it from outside, so this
          # costs five launches and no app code.
          #
          # Light only. The question here is whether things fit, and that is
          # the same question in both appearances.
          if xcrun simctl ui "$DEVICE" appearance light \
            && xcrun simctl ui "$DEVICE" content_size accessibility-extra-extra-extra-large; then
            for TAB in library groceries sousChef pantry settings; do
              capture "ax5" "$TAB"
            done
            # Put it back, so a later step never inherits AX5 by surprise.
            xcrun simctl ui "$DEVICE" content_size large || true
          else
            echo "content_size is not supported here; skipping the AX5 pass."
          fi


      # Always, so a red build is still a build you can look at — a layout bug
      # bad enough to fail the render check is exactly when the pictures are
      # worth the most.
      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 14

      # The same pictures again, on a branch, because the artifact above can
      # only be reached by a person with a browser.
      #
      # An artifact download redirects to blob.core.windows.net, and the agent
      # sandbox that does the actual fixing cannot reach that host — so the
      # captures were visible to everyone except the one reader who needed
      # them. Git talks to github.com, which is reachable, so the pictures go
      # where the reader already is.
      #
      # A fresh repository every time and a force push, so `ci/screens` is
      # always exactly one commit holding the current pictures. It never grows,
      # it is never merged, and nothing builds from it.
      #
      # `continue-on-error`, like the capture itself: publishing pictures must
      # never be what turns a build red.
      - name: Publish screens to the ci/screens branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC="$RUNNER_TEMP/screens"
          ls "$SRC"/*.png >/dev/null 2>&1 || { echo "No screens to publish."; exit 0; }

          WORK="$RUNNER_TEMP/screens-branch"
          rm -rf "$WORK" && mkdir -p "$WORK"
          cp "$SRC"/*.png "$WORK"/

          {
            echo "# Screens"
            echo
            echo "Captured from \`$GITHUB_REF_NAME\` at \`$GITHUB_SHA\`."
            echo
            echo "Five tabs, light and dark. Rebuilt and force-pushed by every"
            echo "run of the iOS workflow — this branch is a noticeboard, not"
            echo "history. Nothing merges it."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$WORK/README.md"

          cd "$WORK"
          git init -q
          git checkout -q -b ci/screens
          git config user.name "Cozy Crumb CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screens from $GITHUB_REF_NAME @ ${GITHUB_SHA:0:7}"
          git push -q --force \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            ci/screens
          echo "Published $(ls -1 *.png | wc -l | tr -d ' ') screens to ci/screens."

      # Runs against the shared scheme, which builds the app as the test host
      # and then the test bundle. The simulator is picked from whatever the
      # runner actually has rather than named outright — a hard-coded device
      # name turns a runner image bump into a red build for no real reason.
      - name: Test
        run: |
          set -o pipefail

          DEVICE=$(xcrun simctl list devices available \
            | grep -E '^ +iPhone' \
            | head -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')

          if [ -z "$DEVICE" ]; then
            echo "::error::No iPhone simulator available on this runner."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Testing on simulator $DEVICE"
          xcodebuild test \
            -project "Cozy Crumb.xcodeproj" \
            -scheme "Cozy Crumb" \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # The spec asks for zero compiler warnings (§11). Only warnings from our
      # own Swift files are counted — toolchain noise like the AppIntents
      # metadata processor is not something we can fix and would make the gate
      # meaningless. Reported rather than enforced for now; flip the commented
      # exit on once this has stayed at zero for a while.
      - name: Swift warning gate
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo "No build log."
            exit 0
          fi

          grep "warning:" build.log | grep "\.swift:" | sort -u > swift-warnings.txt || true
          COUNT=$(wc -l < swift-warnings.txt | tr -d ' ')

          echo "Swift source warnings: $COUNT"
          [ "$COUNT" -gt 0 ] && cat swift-warnings.txt

          {
            echo "### Swift source warnings: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo ""
              echo '```'
              head -20 swift-warnings.txt
              echo '```'
            else
              echo ""
              echo "Clean."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Uncomment to make warnings blocking:
          # [ "$COUNT" -eq 0 ] || exit 1
